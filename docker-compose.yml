services:
  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: PoiLkjmnb25@
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - fhcs-network
  pgadmin:
    image: dpage/pgadmin4:9.5
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: dba@fhcsdlqauditor.com
      PGADMIN_DEFAULT_PASSWORD: dlqauditor
    ports:
      - 8083:80
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - fhcs-network
volumes:
  postgres-data:
  pgadmin-data:
  kafka-data:
networks:
  fhcs-network:
    driver: bridge